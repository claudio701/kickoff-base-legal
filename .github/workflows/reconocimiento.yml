# TEMPORAL: reconocimiento de fuentes (robots.txt, términos, formato). Se borra antes de cerrar.
name: Reconocimiento de fuentes (temporal)
on:
  push:
    branches: [claude/fuentes-adicionales]
    paths: [".github/workflows/reconocimiento.yml"]
jobs:
  reconocer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Leer robots.txt y páginas de muestra
        run: |
          python3 - <<'PY'
          import re, time, urllib.request, urllib.error, html
          UA = "Mozilla/5.0 (compatible; kickoff-base-legal/1.0; +https://github.com/claudio701/kickoff-base-legal)"
          def get(url, n=4000, enlaces=False, filtro=None):
              time.sleep(6)
              print(f"\n######## GET {url}", flush=True)
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": UA}), timeout=60) as r:
                      datos = r.read()
                      print("status", r.status, "final", r.geturl(), "ctype", r.headers.get("Content-Type"), "bytes", len(datos))
              except urllib.error.HTTPError as e:
                  print("HTTPError", e.code, e.headers.get("Retry-After")); datos = e.read()
              except Exception as e:
                  print("ERROR", repr(e)); return ""
              t = datos.decode("utf-8", "replace")
              if enlaces:
                  for href, txt in re.findall(r'<a\b[^>]*href=["\']([^"\']+)["\'][^>]*>(.*?)</a>', t, re.S | re.I):
                      txt = re.sub(r"\s+", " ", html.unescape(re.sub(r"<[^>]+>", " ", txt))).strip()
                      if filtro is None or re.search(filtro, href + " " + txt, re.I):
                          print("  LINK", href, "|", txt[:120])
              print(t[:n])
              return t
          def texto(url, n=12000):
              t = get(url, n=0)
              t = re.sub(r"<(script|style)\b.*?</\1>", " ", t, flags=re.S | re.I)
              t = re.sub(r"\s+", " ", html.unescape(re.sub(r"<[^>]+>", " ", t)))
              print("TEXTO:", t[:n])
          get("https://www.tta.cl/page-sitemap.xml", n=0, enlaces=False)
          ps = get("https://www.tta.cl/page-sitemap.xml", n=0)
          for loc in re.findall(r"<loc>([^<]+)</loc>", ps):
              print("  PAGE", loc)
          sm = get("https://www.tta.cl/post-sitemap.xml", n=1500)
          locs = re.findall(r"<loc>([^<]+)</loc>", sm)
          print("TOTAL posts en sitemap:", len(locs))
          for loc in locs[:15]:
              print("  POST", loc)
          cat = get("https://www.tta.cl/category/fallos-relevantes/", n=0, enlaces=True, filtro=r"tta\.cl/(?!category|wp-|#)|page/|\.pdf")
          i = cat.find("<article")
          print("ARTICLE-FRAGMENTO:", cat[i:i+4000] if i >= 0 else cat[20000:24000])
          get("https://www.tta.cl/category/fallos-relevantes/feed/", n=6000)
          o = get("https://ojv.tta.cl/", n=0)
          for s in re.findall(r'<script[^>]+src="([^"]+)"', o):
              js = get("https://ojv.tta.cl/" + s.lstrip("/"), n=0)
              for m in re.finditer(r"jurisprudencia|recaptcha|captcha|fallos-ela|https?://[a-z0-9.-]+tta\.cl[^\"' ]*", js, re.I):
                  print("  JS", s, m.start(), repr(js[max(0, m.start()-150):m.end()+250]))
          PY
