# TEMPORAL: reconocimiento de fuentes (robots.txt, términos, formato). Se borra antes de cerrar.
name: Reconocimiento de fuentes (temporal)
on:
  push:
    branches: [claude/fuentes-adicionales]
    paths: [".github/workflows/reconocimiento.yml"]
jobs:
  reconocer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Leer robots.txt y páginas de muestra
        run: |
          python3 - <<'PY'
          import re, time, urllib.request, urllib.error, html
          UA = "Mozilla/5.0 (compatible; kickoff-base-legal/1.0; +https://github.com/claudio701/kickoff-base-legal)"
          def get(url, n=4000, enlaces=False, filtro=None):
              time.sleep(6)
              print(f"\n######## GET {url}", flush=True)
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": UA}), timeout=60) as r:
                      datos = r.read()
                      print("status", r.status, "final", r.geturl(), "ctype", r.headers.get("Content-Type"), "bytes", len(datos))
              except urllib.error.HTTPError as e:
                  print("HTTPError", e.code, e.headers.get("Retry-After")); datos = e.read()
              except Exception as e:
                  print("ERROR", repr(e)); return ""
              t = datos.decode("utf-8", "replace")
              if enlaces:
                  for href, txt in re.findall(r'<a\b[^>]*href=["\']([^"\']+)["\'][^>]*>(.*?)</a>', t, re.S | re.I):
                      txt = re.sub(r"\s+", " ", html.unescape(re.sub(r"<[^>]+>", " ", txt))).strip()
                      if filtro is None or re.search(filtro, href + " " + txt, re.I):
                          print("  LINK", href, "|", txt[:120])
              print(t[:n])
              return t
          def texto(url, n=12000):
              t = get(url, n=0)
              t = re.sub(r"<(script|style)\b.*?</\1>", " ", t, flags=re.S | re.I)
              t = re.sub(r"\s+", " ", html.unescape(re.sub(r"<[^>]+>", " ", t)))
              print("TEXTO:", t[:n])
          def plano(f):
              f = re.sub(r"<(script|style)\b.*?</\1>", " ", f, flags=re.S | re.I)
              f = re.sub(r"<br\s*/?>|</p>|</div>|</h\d>|</li>|</tr>", "\n", f, flags=re.I)
              return "\n".join(l for l in (re.sub(r"[ \t]+", " ", html.unescape(re.sub(r"<[^>]+>", " ", x))).strip() for x in f.splitlines()) if l)
          for pag in range(1, 8):
              f = get(f"https://www.tta.cl/category/fallos-relevantes/feed/?paged={pag}", n=0)
              items = re.findall(r"<item>(.*?)</item>", f, re.S)
              print("PAGINA", pag, "items", len(items))
              for k, it in enumerate(items):
                  tit = re.search(r"<title>(.*?)</title>", it, re.S).group(1)
                  fecha = re.search(r"<pubDate>(.*?)</pubDate>", it).group(1)
                  guid = re.search(r"<guid[^>]*>(.*?)</guid>", it).group(1)
                  cont = re.search(r"<content:encoded><!\[CDATA\[(.*?)\]\]></content:encoded>", it, re.S)
                  c = cont.group(1) if cont else ""
                  pdfs = re.findall(r'href=["\']([^"\']+\.pdf)["\']', c, re.I)
                  txt = plano(c)
                  print(f"  ITEM {pag}.{k} {guid} | {fecha} | {tit[:90]} | chars={len(txt)} | pdfs={pdfs[:3]}")
                  if (pag == 1 and k == 0) or (k == len(items) - 1 and len(items) < 10):
                      print("TEXTO-ITEM:\n" + txt[:6000])
              if len(items) < 10:
                  break
          for u in ["https://www.tta.cl/bases-jurisprudenciales/", "https://www.tta.cl/jurisprudencia/"]:
              b = get(u, n=0, enlaces=True, filtro=r"\.pdf|jurisprud|sentencia|fallo")
          PY
